<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Portfolio | Black & White</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  font-family: 'Helvetica Neue', Arial, sans-serif;
  background: #0a0a0a;
  color: #f5f5f5;
}

/* Slider */
.slider {
  position: relative;
  width: 100vw;
  height: 100vh;
}

.slide {
  position: absolute;
  width: 100%;
  height: 100%;
  opacity: 0;
  transition: opacity 0.8s ease;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 5%;
}

.slide.active {
  opacity: 1;
  z-index: 2;
}

/* Slide 1 */
.slide-cover {
  text-align: center;
  background: #111;
}

.slide-cover h1 {
  font-size: clamp(2.5rem, 8vw, 6rem);
  font-weight: 200;
  letter-spacing: 0.1em;
}

.slide-cover p {
  color: #999;
  letter-spacing: 0.3em;
}

/* Slide 2 */
.slide-about {
  background: #f5f5f5;
  color: #0a0a0a;
  gap: 5%;
}

.slide-about img {
  width: 40%;
  height: 80%;
  object-fit: cover;
  filter: grayscale(100%);
}

.text {
  width: 45%;
}

.slide-about h2 {
  font-size: clamp(2rem, 5vw, 3.5rem);
  margin-bottom: 2rem;
  border-bottom: 2px solid #0a0a0a;
}

.slide-about p {
  line-height: 1.8;
}

/* Slide 3 */
.slide-work {
  flex-direction: column;
}

.grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 1rem;
  width: 80%;
}

.grid img {
  width: 100%;
  height: 250px;
  object-fit: cover;
  filter: grayscale(100%);
}

.grid img:hover {
  filter: grayscale(0%);
}

/* Slide 4 */
.slide-contact {
  background: #f5f5f5;
  color: #0a0a0a;
  flex-direction: column;
}

.slide-contact a {
  border: 1px solid #000;
  padding: 1rem 2rem;
  text-decoration: none;
}

/* Slide 5 Form */
.slide-form {
  flex-direction: column;
  text-align: center;
}

.slide-form h1 {
  font-size: clamp(2rem,5vw,3rem);
  margin-bottom: 2rem;
}

.form-container {
  width: 100%;
  max-width: 400px;
}

.form-group {
  margin-bottom: 1rem;
}

.form-group input,
.form-group textarea {
  width: 100%;
  padding: 0.8rem;
  background: transparent;
  border: 1px solid #333;
  color: #fff;
}

.submit-btn {
  width: 100%;
  padding: 1rem;
  background: #fff;
  color: #000;
  border: none;
  cursor: pointer;
}

/* NAV DOTS */
.nav {
  position: fixed;
  bottom: 3%;
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  gap: 1rem;
  z-index: 999;
}

.nav button {
  width: 12px;
  height: 12px;
  border-radius: 50%;
  border: 1px solid #fff;
  background: transparent;
  cursor: pointer;
}

.nav button.active {
  background: #fff;
}

/* ARROWS FIX */
.arrows {
  position: fixed;
  top: 50%;
  width: 100%;
  display: flex;
  justify-content: space-between;
  padding: 0 3%;
  transform: translateY(-50%);
  z-index: 999;
}

.arrows button {
  background: rgba(255,255,255,0.2);
  border: none;
  color: #fff;
  font-size: 2rem;
  cursor: pointer;
  padding: 10px 15px;
}

.arrows button:hover {
  background: rgba(255,255,255,0.4);
}

/* Mobile */
@media (max-width: 768px) {
  .slide-about {
    flex-direction: column;
  }

  .slide-about img, .text {
    width: 90%;
    height: auto;
  }

  .grid {
    grid-template-columns: 1fr;
  }
}
</style>
</head>

<body>

<div class="slider">

<!-- Slide 1 -->
<div class="slide slide-cover active">
  <div>
    <h1>SIMRAN MOTWANI</h1>
    <p>Portfolio 2026</p>
  </div>
</div>

<!-- Slide 2 -->
<div class="slide slide-about">
  <img src="simran.jpeg" alt="Profile">
  <div class="text">
    <h2>About</h2>
    <p>I’m a designer focused on minimalism, contrast, and clarity.</p>
  </div>
</div>

<!-- Slide 3 -->
<div class="slide slide-work">
  <h2>SELECTED WORK</h2>
  <div class="grid">
    <img src="https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?w=600&q=80">
    <img src="https://images.unsplash.com/photo-1634986666676-ec8fd927c23d?w=600&q=80">
    <img src="https://images.unsplash.com/photo-1558655146-9f40138edfeb?w=600&q=80">
  </div>
</div>

<!-- Slide 4 -->
<div class="slide slide-contact">
  <h2>Let's Work Together</h2>
  <a href="mailto:hello@yourname.com">Hello</a>
</div>

<!-- Slide 5 FORM -->
<div class="slide slide-form">
  <h1>Contact Me</h1>

  <div class="form-container">
    <div class="form-group">
      <input type="text" placeholder="Name">
    </div>

    <div class="form-group">
      <input type="text" placeholder="Contact">
    </div>

    <div class="form-group">
      <input type="email" placeholder="Email">
    </div>

    <div class="form-group">
      <textarea placeholder="Message"></textarea>
    </div>

    <button class="submit-btn">Send</button>
  </div>
</div>

</div>

<!-- NAV -->
<div class="nav"></div>

<!-- ARROWS -->
<div class="arrows">
  <button id="prev">❮</button>
  <button id="next">❯</button>
</div>

<script>
const slides = document.querySelectorAll('.slide');
const nav = document.querySelector('.nav');
let current = 0;

/* dots */
slides.forEach((_, i) => {
  const dot = document.createElement('button');
  if (i === 0) dot.classList.add('active');

  dot.addEventListener('click', () => goToSlide(i));
  nav.appendChild(dot);
});

const dots = nav.querySelectorAll('button');

/* function */
function goToSlide(n) {
  slides[current].classList.remove('active');
  dots[current].classList.remove('active');

  current = (n + slides.length) % slides.length;

  slides[current].classList.add('active');
  dots[current].classList.add('active');
}

/* arrows */
document.getElementById('prev').onclick = () => goToSlide(current - 1);
document.getElementById('next').onclick = () => goToSlide(current + 1);

/* keyboard */
document.addEventListener('keydown', (e) => {
  if (e.key === 'ArrowRight') goToSlide(current + 1);
  if (e.key === 'ArrowLeft') goToSlide(current - 1);
});
</script>

</body>
</html>
